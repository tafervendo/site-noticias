name: Atualizar notícias

on:
  schedule:
    - cron: "*/30 * * * *"   # a cada 30 minutos
  workflow_dispatch:          # botão "Run workflow" para rodar na hora
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: atualizar
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # sempre a versão mais nova, com o histórico da rodada anterior
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Buscar notícias, escrever resumos e gerar o site
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python build.py
      - name: Guardar o histórico de notícias
        run: |
          git config user.name "robo-noticias"
          git config user.email "robo-noticias@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "Atualiza notícias"
          for i in 1 2 3; do
            git push && exit 0
            # alguém enviou algo antes: traz a versão nova e mantém os dados desta rodada
            git pull --rebase -X theirs origin main || { git rebase --abort; git pull --no-rebase -X ours origin main; }
          done
          echo "::warning::Não consegui guardar o histórico desta rodada"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
