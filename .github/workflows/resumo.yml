name: Resumo diário

on:
  schedule:
    - cron: "0 12 * * *"   # 9h no horário de Brasília
  workflow_dispatch:
    inputs:
      dia:
        description: "ontem ou hoje (hoje serve para teste)"
        default: "ontem"

permissions:
  contents: read
  actions: read
  id-token: write   # o GitHub prova ao Google que é o robô do site (sem senha guardada)

jobs:
  resumo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Entrar no Google como robô só de leitura
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/123136129262/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: robo-resumo@tafervendo-relatorios.iam.gserviceaccount.com
      - name: Enviar o resumo por e-mail
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESUMO_DE: ${{ github.event.inputs.dia }}
        run: python resumo_diario.py
